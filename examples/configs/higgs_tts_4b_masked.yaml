config_cls: HiggsTtsPipelineConfig
model_path: bosonai/higgs-tts-3-4b
name: bosonai/higgs-tts-3-4b
relay_backend: shm

# Allow request-scoped `lora_adapter.path` adapters. Cached adapters stay in
# SGLang's LoRA memory pool and are not reloaded on subsequent requests.
enable_dynamic_lora: true
lora_base_dir: /adapters
lora_max_cached_adapters: 8
lora_max_rank: 32

# Keep autoregressive generation and waveform decoding in separate processes.
separate_vocoder_process: true

# K8/M3 is an audio-quality constraint established by listening tests: wait
# for eight delayed rows and emit three startup frames. Do not lower K below 8
# to chase startup latency; more aggressive masking audibly degrades quality.
# K8/M4 was also tested, but its latency gain was too small to pursue.
vocoder_stream_stride: 32
vocoder_startup_low_latency: true
vocoder_startup_masked_delay_rows: 8
vocoder_startup_masked_emit_frames: 3
vocoder_startup_masked_until_frames: 8
